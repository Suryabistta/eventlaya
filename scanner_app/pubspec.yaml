name: eventlaya_scanner
description: Eventlaya Gate Scanner & Organizer App — QR Ticketing, Attendance Management, Live Stats, Push Notifications
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # QR Camera Scanner
  mobile_scanner: ^7.0.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Storage & Offline Queue
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Push Notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Audio + Haptics Feedback
  audioplayers: ^6.1.0
  vibration: ^2.0.0

  # UI & UX
  google_fonts: ^6.2.1
  lottie: ^3.1.3
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0

  # Utilities
  clock: ^1.1.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.2
  wakelock_plus: ^1.2.10
  flutter_svg: ^2.0.10+1
  web_socket_channel: ^3.0.3
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  share_plus: ^12.0.2
  smart_auth: ^3.2.0
  gal: ^2.3.3
  printing: ^5.14.3
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/animations/
    # Bundled Google Fonts (Bricolage Grotesque, Poppins, JetBrains Mono) so text
    # renders offline at the gate; google_fonts picks them up from here.
    - assets/google_fonts/

dependency_overrides:
  # image 4.11+ calls ZLibDecoder.decodeLazy (archive 4.1+), but pdf caps archive below 4.1; release builds fail
  image: 4.10.1
