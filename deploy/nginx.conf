# Web app on __DOMAIN__ (same-origin /api and /media), API for the mobile app on __API_DOMAIN__.
upstream eventlaya_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;
    client_max_body_size 20M;

    root /srv/eventlaya/frontend;
    index index.html;

    # BEGIN eventlaya-seo (managed by deploy/enable_seo_routes.sh; edits inside are overwritten)
    # robots.txt, sitemaps and llms.txt are generated by Django (apps/seo) for each host.
    location = /robots.txt {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
    }
    location = /sitemap.xml {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
    }
    location ^~ /sitemaps/ {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
    }
    location = /llms.txt {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
    }
    location = /llms-full.txt {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
    }
    # Pages whose HTML carries their own title, description, canonical, Open Graph and JSON-LD (apps/seo).
    # If the app server is down, visitors still get the web app.
    location ~ ^/(e/|blog(/|$)|marketplace/(venues|vendors)/) {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
        proxy_intercept_errors on;
        error_page 502 503 504 = @eventlaya_spa;
    }
    location @eventlaya_spa {
        try_files /index.html =404;
    }
    location ^~ /prerender/ {
        internal;
    }
    # Prerendered marketing pages (npm run prerender → /srv/eventlaya/frontend/prerender/), eventlaya.com only.
    # The homepage goes through Django (apps/seo): it serves the same prerendered copy plus the Search Console /
    # Bing verification tags saved in Admin → Analytics. Django down → the static copy.
    location = / {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
        proxy_intercept_errors on;
        error_page 502 503 504 = @eventlaya_home;
    }
    location @eventlaya_home {
        try_files /prerender/index.html /index.html =404;
    }
    location ~ ^/(events|marketplace|pricing|privacy|terms|community-guidelines|delete-account|contact)/?$ {
        try_files /prerender/$1/index.html /index.html;
    }
    # END eventlaya-seo
    location /api/ {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
    }
    # Team chat websockets (long-lived; the app pings, so 1 h idle timeout is plenty).
    location /ws/ {
        proxy_pass http://eventlaya_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/proxy_params;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location /media/ {
        alias /mnt/eventlaya_media/media/;
        expires 7d;
    }
    location /static/ {
        alias /srv/eventlaya/backend/staticfiles/;
        expires 30d;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name __API_DOMAIN__;
    client_max_body_size 20M;

    location /media/ {
        alias /mnt/eventlaya_media/media/;
        expires 7d;
    }
    location /static/ {
        alias /srv/eventlaya/backend/staticfiles/;
        expires 30d;
    }
    # Team chat websockets (long-lived; the app pings, so 1 h idle timeout is plenty).
    location /ws/ {
        proxy_pass http://eventlaya_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/proxy_params;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
    }
}

# White-label sites (docs/white-label.md): customer domains such as event.dharanfilmfestival.org and the free
# <name>.__DOMAIN__ addresses. Cloudflare for SaaS sends customer domains to the fallback origin
# tenants.__DOMAIN__ (→ this droplet) and keeps the visitor's Host header, so this default server answers every
# host not named above. It serves the same web app + same-origin /api, /ws and /media as __DOMAIN__; Django
# (apps.accounts.tenancy) picks the organization from the Host and answers 400 for hosts nobody claimed.
#
# HTTPS from Cloudflare to the origin: install a Cloudflare Origin CA certificate covering
# "__DOMAIN__, *.__DOMAIN__" at the paths below, then enable the two `listen 443` lines and the ssl_* lines.
# (Left commented so a fresh setup_server.sh run doesn't fail before the certificate exists.)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # listen 443 ssl default_server;
    # listen [::]:443 ssl default_server;
    # ssl_certificate     /etc/ssl/eventlaya/origin-wildcard.pem;
    # ssl_certificate_key /etc/ssl/eventlaya/origin-wildcard.key;
    server_name _ tenants.__DOMAIN__ *.__DOMAIN__;
    client_max_body_size 20M;

    root /srv/eventlaya/frontend;
    index index.html;

    # BEGIN eventlaya-seo (managed by deploy/enable_seo_routes.sh; edits inside are overwritten)
    # robots.txt, sitemaps and llms.txt are generated by Django (apps/seo) for each host.
    location = /robots.txt {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
    }
    location = /sitemap.xml {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
    }
    location ^~ /sitemaps/ {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
    }
    location = /llms.txt {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
    }
    location = /llms-full.txt {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
    }
    # Pages whose HTML carries their own title, description, canonical, Open Graph and JSON-LD (apps/seo).
    # If the app server is down, visitors still get the web app.
    location ~ ^/(e/|blog(/|$)|marketplace/(venues|vendors)/) {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;
        proxy_intercept_errors on;
        error_page 502 503 504 = @eventlaya_spa;
    }
    location @eventlaya_spa {
        try_files /index.html =404;
    }
    location ^~ /prerender/ {
        internal;
    }
    # END eventlaya-seo
    location /api/ {
        proxy_pass http://eventlaya_api;
        include /etc/nginx/proxy_params;  # passes Host: <customer domain> through to Django
    }
    location /ws/ {
        proxy_pass http://eventlaya_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/proxy_params;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location /media/ {
        alias /mnt/eventlaya_media/media/;
        expires 7d;
    }
    location /static/ {
        alias /srv/eventlaya/backend/staticfiles/;
        expires 30d;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
